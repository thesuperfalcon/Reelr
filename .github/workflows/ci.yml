name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # A throwaway SQL Server for this job only, with a password made up for each run. No repository secret is
      # needed, so pull requests that get no secrets (Dependabot's, forks) are tested too.
      - name: Start SQL Server
        run: |
          password="$(openssl rand -hex 16)-Aa1"
          echo "::add-mask::$password"
          echo "SA_PASSWORD=$password" >> "$GITHUB_ENV"
          # ReelrApiFactory appends "Database=...;" to this value.
          echo "REELR_TEST_SQLSERVER=Server=localhost,1433;User Id=sa;Password=$password;TrustServerCertificate=True;" >> "$GITHUB_ENV"
          docker run --detach --name sqlserver --env ACCEPT_EULA=Y --env "MSSQL_SA_PASSWORD=$password" \
            --publish 1433:1433 mcr.microsoft.com/mssql/server:2022-latest

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/backend.slnx

      - name: Build
        run: dotnet build backend/backend.slnx --configuration Release --no-restore

      # Started before the build, so it is usually up by now.
      - name: Wait for SQL Server
        run: |
          for attempt in $(seq 1 30); do
            if docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" -b > /dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          docker logs sqlserver
          exit 1

      - name: Test
        run: >-
          dotnet test backend/backend.slnx
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      # The tests build their database with EnsureCreated, so the migrations themselves are checked here:
      # they must match the model, and apply cleanly to an empty database.
      - name: Check that the migrations match the model
        working-directory: backend
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --configuration Release

      - name: Apply every migration to an empty database
        working-directory: backend
        run: |
          dotnet ef migrations bundle --configuration Release --output efbundle
          ./efbundle --connection "Server=localhost,1433;Database=ReelrMigrations;User Id=sa;Password=$SA_PASSWORD;TrustServerCertificate=True;"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-test-results
          path: TestResults

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # No "needs": it runs next to the other jobs, so a push waits for the slowest job only.

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The stack reads its secrets from .env. The database password is made up for each run, so no repository
      # secret is needed; single quotes stop Compose from reading "$" in the values. docker-compose.e2e.yml sets
      # the fake TMDB token.
      - name: Write the stack's settings
        run: |
          SA_PASSWORD="$(openssl rand -hex 16)-Aa1"
          {
            printf "MSSQL_SA_PASSWORD='%s'\n" "$SA_PASSWORD"
            printf "ConnectionStrings__ReelrContext='Server=db;Database=Reelr;User Id=sa;Password=%s;TrustServerCertificate=True;'\n" "$SA_PASSWORD"
            printf "Jwt__Key='%s'\n" "$(openssl rand -base64 48)"
          } > .env

      # The images are built here with the GitHub Actions layer cache, so unchanged layers (restore, npm ci) are
      # reused between runs. They get the names Compose gives them in the reelr-e2e project, so "up" finds them.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          load: true
          tags: reelr-e2e-backend:latest
          cache-from: type=gha,scope=e2e-backend
          cache-to: type=gha,scope=e2e-backend,mode=max

      # The "migrate" service: the migrations bundle stage of the backend Dockerfile. It shares the backend's
      # build stages, so its cache scope reuses the restore and publish layers.
      - name: Build the migrations image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          target: migrations
          load: true
          tags: reelr-e2e-migrate:latest
          cache-from: |
            type=gha,scope=e2e-backend
            type=gha,scope=e2e-migrate
          cache-to: type=gha,scope=e2e-migrate,mode=max

      - name: Build the frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          load: true
          tags: reelr-e2e-frontend:latest
          cache-from: type=gha,scope=e2e-frontend
          cache-to: type=gha,scope=e2e-frontend,mode=max

      - name: Start the stack
        run: docker compose -p reelr-e2e -f docker-compose.yml -f docker-compose.e2e.yml up -d --no-build --wait

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install
        working-directory: e2e
        run: npm ci

      # The browser download is cached per Playwright version; its system libraries are installed every run.
      - name: Read the Playwright version
        id: playwright
        working-directory: e2e
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install the browser
        working-directory: e2e
        run: |
          if [ "${{ steps.browsers.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Test
        working-directory: e2e
        run: npx playwright test

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results

      - name: Show the stack's logs
        if: failure()
        run: docker compose -p reelr-e2e -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose -p reelr-e2e -f docker-compose.yml -f docker-compose.e2e.yml down -v
