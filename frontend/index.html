<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Older browsers take the .ico, the rest the SVG. Phones use the touch icon and the manifest for the home screen. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1420" />
    <title>Reelr</title>
    <meta
      name="description"
      content="Reelr is a film diary to share with friends: log what you watch, rate and review films, make lists and see what your friends are watching."
    />
    <!-- Link previews in chats and social media. These crawlers do not run JavaScript, so every page shares one
         preview. Their image address must be absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Reelr" />
    <meta property="og:title" content="Reelr" />
    <meta property="og:description" content="A film diary to share with your friends. Invite only for now." />
    <meta property="og:image" content="https://reelr.se/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Reelr, a film diary to share with your friends, next to a film reel." />
    <meta name="twitter:card" content="summary_large_image" />
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
