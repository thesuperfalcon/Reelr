# Browser security headers, included in every location that sets its own headers
# (nginx drops the server-level add_header lines in a location that has any of its own).

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Only code and styles from this site run. Images may also come from TMDB, and blob: is the avatar preview
# before upload. Should an attacker get HTML into a page, no script from elsewhere or inline script would run.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://image.tmdb.org blob: data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Tells browsers to use HTTPS only for a year. Browsers ignore it over plain HTTP, so it takes effect
# once TLS is set up in front of nginx.
add_header Strict-Transport-Security "max-age=31536000" always;
