name: Deploy

# Runs after CI has passed on main, or by hand. Builds the three images, pushes them to GitHub Container Registry,
# brings the database schema up to date and then rolls out the new images with the Bicep template.
#
# One-time setup: infra/setup-github.ps1 creates the Azure identity this workflow signs in as (OIDC, no stored
# keys) and prints the repository variables to add under Settings > Secrets and variables > Actions > Variables.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer one waits instead of cancelling a rollout halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The commit CI tested, or the one the manual run was started on.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}

jobs:
  images:
    name: Build and push images
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image: reelr-backend
            context: ./backend
            target: runtime
          - image: reelr-migrate
            context: ./backend
            target: migrations
          - image: reelr-frontend
            context: ./frontend
            target: runtime

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SHA }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image names must be lower case; the owner may not be.
      - name: Name the image
        id: name
        run: echo "ref=${IMAGE_REPOSITORY,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ steps.name.outputs.ref }}:${{ env.SHA }}
            ${{ steps.name.outputs.ref }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=deploy-${{ matrix.image }}
          cache-to: type=gha,scope=deploy-${{ matrix.image }},mode=max

  deploy:
    name: Migrate and roll out
    needs: images
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    env:
      RESOURCE_GROUP: rg-reelr
      MIGRATE_JOB: reelr-migrate

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SHA }}

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Name the images
        run: echo "IMAGE_REPOSITORY=${IMAGE_REPOSITORY,,}" >> "$GITHUB_ENV"

      # The schema changes first, so the new backend never runs against an old schema.
      - name: Run the migrations
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp job update --resource-group "$RESOURCE_GROUP" --name "$MIGRATE_JOB" \
            --image "$IMAGE_REPOSITORY/reelr-migrate:$SHA" --output none
          execution=$(az containerapp job start --resource-group "$RESOURCE_GROUP" --name "$MIGRATE_JOB" --query name -o tsv)
          echo "Started $execution"
          while true; do
            sleep 10
            status=$(az containerapp job execution show --resource-group "$RESOURCE_GROUP" --name "$MIGRATE_JOB" \
              --job-execution-name "$execution" --query properties.status -o tsv)
            echo "$status"
            case "$status" in
              Succeeded) break ;;
              Running|Processing) ;;
              *) echo "::error::Migrations ended with status $status"; exit 1 ;;
            esac
          done

      # The template sets everything else as well, so the apps always match infra/.
      - name: Roll out the new images
        env:
          REELR_ADMIN_OBJECT_ID: ${{ vars.REELR_ADMIN_OBJECT_ID }}
          REELR_ADMIN_LOGIN: ${{ vars.REELR_ADMIN_LOGIN }}
          REELR_EMAIL_USER: ${{ vars.REELR_EMAIL_USER }}
          REELR_EMAIL_FROM: ${{ vars.REELR_EMAIL_FROM }}
          REELR_ADMIN_USER_IDS: ${{ vars.REELR_ADMIN_USER_IDS }}
          REELR_DEMO_USER_IDS: ${{ vars.REELR_DEMO_USER_IDS }}
          REELR_ALERT_EMAIL: ${{ vars.REELR_ALERT_EMAIL }}
          REELR_CUSTOM_DOMAIN: ${{ vars.REELR_CUSTOM_DOMAIN }}
          # Unset means invite only.
          REELR_INVITE_ONLY: ${{ vars.REELR_INVITE_ONLY || 'true' }}
          REELR_IMAGE_TAG: ${{ env.SHA }}
          REELR_DEPLOY_APPS: "true"
        run: |
          export REELR_IMAGE_REPOSITORY="$IMAGE_REPOSITORY"
          site=$(az deployment sub create --name "reelr-$SHA" --location swedencentral \
            --template-file infra/main.bicep --parameters infra/main.bicepparam \
            --query properties.outputs.siteUrl.value -o tsv)
          echo "Deployed to $site" >> "$GITHUB_STEP_SUMMARY"
